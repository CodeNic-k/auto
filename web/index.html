<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Websites from YouTube Shorts</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./site-tools.js"></script>
  <style>
    :root { color-scheme:light; --ink:#20243a; --muted:#67708a; --line:#e3e7f0; --brand:#5548d9; --surface:#fff; --bg:#f6f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100% - 32px,960px); margin:auto; padding:32px 0 72px; }
    nav { display:flex; gap:10px; margin-bottom:28px; }
    nav a { padding:8px 13px; border-radius:10px; color:var(--muted); text-decoration:none; font-weight:650; }
    nav a.active, nav a:hover { background:#eae8ff; color:#4438bd; }
    .eyebrow { color:var(--brand); font-size:.8rem; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:8px 0; font-size:clamp(2rem,6vw,3.1rem); line-height:1.08; letter-spacing:-.04em; }
    h2 { margin:28px 0 12px; font-size:1.2rem; }
    .intro { margin:0; max-width:680px; color:var(--muted); }
    .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(190px,230px); gap:12px; margin:22px 0 10px; }
    input,select { width:100%; min-height:48px; padding:10px 13px; border:1px solid var(--line); border-radius:12px; background:white; color:var(--ink); font:inherit; }
    input:focus,select:focus { outline:3px solid #5548d933; border-color:var(--brand); }
    .count { margin:0 2px 12px; color:var(--muted); font-size:.92rem; }
    .category-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .category-card { display:block; padding:14px; border:1px solid var(--line); border-radius:14px; background:white; color:var(--ink); text-decoration:none; transition:transform .15s,border-color .15s; }
    .category-card:hover { transform:translateY(-2px); border-color:#aaa4f5; }
    .category-card strong { display:block; }
    .category-card small { color:var(--muted); }
    #results { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr)); align-items:stretch; gap:14px; }
    .card,.message { padding:19px; border:1px solid var(--line); border-radius:16px; background:white; box-shadow:0 3px 14px #20243a08; }
    .card { display:flex; flex-direction:column; min-width:0; }
    .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .url { overflow-wrap:anywhere; color:var(--brand); font-size:1.08rem; font-weight:700; text-decoration:none; }
    .url:hover,.source:hover { text-decoration:underline; }
    .badge { flex:0 0 auto; padding:4px 9px; border-radius:99px; background:#f0efff; color:#4438bd; font-size:.76rem; font-weight:700; }
    .detail { margin:12px 0; color:#4e566e; white-space:pre-line; }
    .source { color:var(--muted); font-size:.9rem; text-decoration:none; }
    .message { border-style:dashed; color:var(--muted); text-align:center; }
    @media(max-width:620px) { .controls { grid-template-columns:1fr; } #results { grid-template-columns:1fr; } .card-top { flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a class="active" href="./index.html">Websites</a><a href="./notes.html">Notes &amp; tips</a></nav>
    <header>
      <div class="eyebrow">A collection of useful finds</div>
      <h1>Websites from Shorts</h1>
      <p class="intro">Find the exact searches, prompts, and steps shown in each video, with enough context to use them without replaying it.</p>
    </header>
    <section aria-labelledby="categories-heading">
      <h2 id="categories-heading">Website categories</h2>
      <div class="category-grid" id="category-cards"><div class="message">Loading categories…</div></div>
    </section>
    <section aria-label="Search and filter websites">
      <div class="controls">
        <input id="search" type="search" placeholder="Search websites…" aria-label="Search websites">
        <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
      </div>
      <p class="count" id="count" aria-live="polite">Loading websites…</p>
      <div id="results" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const descriptions = {
      "AI tools":"Artificial intelligence websites and apps", "Productivity":"Tools for getting work done",
      "Design":"Visual design and creative tools", "Dev tools":"Software development tools",
      "Privacy/Security":"Privacy, safety, and security tools", "Free resources":"Free downloads and useful resources",
      "Learning":"Courses, explainers, and learning tools", "Entertainment":"Games and entertainment",
      "How-to & workflows":"Searches, prompts, and step-by-step tasks", "Other":"Other useful websites"
    };
    const resultsEl=document.getElementById("results"), countEl=document.getElementById("count");
    const searchEl=document.getElementById("search"), filterEl=document.getElementById("category");
    const categoryCards=document.getElementById("category-cards"); let rows=[],comments=new Map(),siteTools;
    function text(parent,tag,value,className){const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;parent.appendChild(el);return el;}
    function linkLabel(item){try{const url=new URL(item.url),host=url.hostname.toLowerCase().replace(/^www\./,"");const query=url.searchParams.get("q");if(query&&/^google\.[a-z]{2,3}(?:\.[a-z]{2})?$/.test(host))return `Google search: ${query}`;}catch{}return item.domain||item.url;}
    function render(){
      const term=searchEl.value.trim().toLowerCase(),cat=filterEl.value;
      const shown=rows.filter(x=>(!cat||x.category===cat)&&(!term||[x.url,x.domain,x.description,x.category].join(" ").toLowerCase().includes(term)));
      resultsEl.replaceChildren();countEl.textContent=`${shown.length} ${shown.length===1?"website":"websites"}`;
      if(!shown.length){text(resultsEl,"div",rows.length?"No websites match your search.":"No website links have been collected yet.","message");return;}
      for(const item of shown){const card=document.createElement("article");card.className="card";const top=document.createElement("div");top.className="card-top";
        const a=text(top,"a",linkLabel(item),"url");a.href=item.url;a.target="_blank";a.rel="noopener noreferrer";
        text(top,"span",item.category||"Other","badge");card.appendChild(top);
        const detail=text(card,"p",item.description||"No description provided.","detail");
        const source=text(card,"a","Watch source video ↗","source");source.href=`https://www.youtube.com/watch?v=${encodeURIComponent(item.video_id)}`;source.target="_blank";source.rel="noopener noreferrer";resultsEl.appendChild(card);
        siteTools.attach(card,item,"link",detail,comments.get(`link:${item.id}`)||[],load);
      }
    }
    async function load(){
      if(!window.supabase||!window.APP_SUPABASE_URL||!window.APP_SUPABASE_PUBLIC_KEY){countEl.textContent="Supabase configuration is missing.";return;}
      try{
        rows=[];comments=new Map();
        const db=window.supabase.createClient(window.APP_SUPABASE_URL,window.APP_SUPABASE_PUBLIC_KEY),size=1000;
        if(!siteTools){siteTools=window.createSiteTools(db);document.addEventListener("site-editor-change",render);}
        await siteTools.ready;
        for(let from=0;;from+=size){const {data,error}=await db.from("links").select("id,video_id,url,domain,description,category,created_at").order("created_at",{ascending:false}).range(from,from+size-1);if(error)throw error;rows.push(...data);if(data.length<size)break;}
        comments=await siteTools.loadComments(rows,"link");
        const counts=new Map();for(const item of rows){const c=item.category||"Other";counts.set(c,(counts.get(c)||0)+1);}
        categoryCards.replaceChildren();filterEl.replaceChildren();const all=document.createElement("option");all.value="";all.textContent="All categories";filterEl.appendChild(all);
        for(const [name,n] of [...counts].sort((a,b)=>a[0].localeCompare(b[0]))){const option=document.createElement("option");option.value=name;option.textContent=name;filterEl.appendChild(option);
          const box=document.createElement("a");box.className="category-card";box.href=`./category.html?type=websites&category=${encodeURIComponent(name)}`;text(box,"strong",name);text(box,"small",`${n} ${n===1?"website":"websites"} · ${descriptions[name]||"Browse this category"}`);categoryCards.appendChild(box);}
        if(!counts.size)text(categoryCards,"div","Categories will appear after website links are collected.","message");render();
      }catch(error){console.error(error);countEl.textContent="Could not load websites. Check the Supabase URL, public key, table grants, and RLS policy.";categoryCards.replaceChildren();resultsEl.replaceChildren();text(resultsEl,"div","Supabase could not return the links table.","message");}
    }
    searchEl.addEventListener("input",render);filterEl.addEventListener("change",render);load();
  </script>
</body>
</html>
