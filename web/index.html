<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Websites from YouTube Shorts</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #20243a;
      --muted: #67708a;
      --line: #e3e7f0;
      --brand: #5548d9;
      --surface: #fff;
      --background: #f6f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100% - 32px, 920px); margin: 0 auto; padding: 48px 0 72px; }
    header { margin-bottom: 28px; }
    .eyebrow { color: var(--brand); font-size: .8rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.08; letter-spacing: -.04em; }
    .intro { margin: 0; max-width: 650px; color: var(--muted); }
    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(190px, 230px);
      gap: 12px;
      margin: 24px 0 12px;
    }
    input, select {
      width: 100%; min-height: 48px; padding: 10px 13px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit;
    }
    input:focus, select:focus { outline: 3px solid #5548d933; border-color: var(--brand); }
    .result-count { min-height: 24px; margin: 0 2px 12px; color: var(--muted); font-size: .92rem; }
    #results { display: grid; gap: 12px; }
    .card { padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 3px 14px #20243a08; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .url { overflow-wrap: anywhere; color: var(--brand); font-size: 1.08rem; font-weight: 700; text-decoration: none; }
    .url:hover, .source:hover { text-decoration: underline; }
    .category { flex: 0 0 auto; padding: 4px 9px; border-radius: 99px; background: #f0efff; color: #4438bd; font-size: .76rem; font-weight: 700; }
    .description { margin: 12px 0; color: #4e566e; }
    .source { color: var(--muted); font-size: .9rem; text-decoration: none; }
    .message { padding: 28px 18px; border: 1px dashed #cbd1df; border-radius: 16px; color: var(--muted); text-align: center; }
    .error { border-color: #f0b7b7; color: #9b2424; background: #fff8f8; }
    @media (max-width: 620px) {
      main { padding-top: 32px; }
      .controls { grid-template-columns: 1fr; }
      .card-top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">A collection of useful finds</div>
      <h1>Websites from Shorts</h1>
      <p class="intro">Explore websites spotted or mentioned in YouTube Shorts. Search by name, description, or domain, or filter by category.</p>
    </header>

    <section aria-label="Search and filter links">
      <div class="controls">
        <input id="search" type="search" placeholder="Search websites…" aria-label="Search websites">
        <select id="category" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
      </div>
      <p class="result-count" id="count" aria-live="polite">Loading websites…</p>
      <div id="results" aria-live="polite"></div>
    </section>
  </main>

  <script>
    // Replace these two example strings with the public URL and anon/publishable key
    // from your Supabase project. Never put the service key in this web page.
    const SUPABASE_URL = "https://qbnmjxjiffftacdktnny.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibm1qeGppZmZmdGFjZGt0bm55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTg2MDgsImV4cCI6MjEwODczNDYwOH0.BBmWy2-LbyZOOGT83iMW9LSyjfyh4Um_wVDWEQrToyY";

    const resultsElement = document.getElementById("results");
    const countElement = document.getElementById("count");
    const searchInput = document.getElementById("search");
    const categorySelect = document.getElementById("category");
    let allLinks = [];

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    function render() {
      const term = searchInput.value.trim().toLowerCase();
      const category = categorySelect.value;
      const filtered = allLinks.filter((link) => {
        const searchable = [link.url, link.domain, link.description, link.category].join(" ").toLowerCase();
        return (!term || searchable.includes(term)) && (!category || link.category === category);
      });

      resultsElement.replaceChildren();
      countElement.textContent = `${filtered.length} ${filtered.length === 1 ? "website" : "websites"}`;
      if (filtered.length === 0) {
        addText(resultsElement, "div", allLinks.length ? "No websites match your search." : "No links have been collected yet.", "message");
        return;
      }

      for (const link of filtered) {
        const card = document.createElement("article");
        card.className = "card";
        const top = document.createElement("div");
        top.className = "card-top";
        const website = addText(top, "a", link.domain || link.url, "url");
        website.href = link.url;
        website.target = "_blank";
        website.rel = "noopener noreferrer";
        addText(top, "span", link.category || "Other", "category");
        card.appendChild(top);
        addText(card, "p", link.description || "No description provided.", "description");

        const source = addText(card, "a", "Watch source video ↗", "source");
        source.href = `https://www.youtube.com/watch?v=${encodeURIComponent(link.video_id)}`;
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        resultsElement.appendChild(card);
      }
    }

    async function loadLinks() {
      if (SUPABASE_URL.includes("YOUR_PROJECT_ID") || SUPABASE_ANON_KEY.includes("YOUR_SUPABASE")) {
        countElement.textContent = "Add your Supabase URL and public key in web/index.html to connect the page.";
        resultsElement.replaceChildren();
        return;
      }
      if (!window.supabase) {
        countElement.textContent = "Could not load the Supabase library. Check your internet connection and reload.";
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      try {
        // Supabase returns at most 1,000 rows by default, so fetch in pages.
        const pageSize = 1000;
        for (let start = 0; ; start += pageSize) {
          const { data, error } = await client
            .from("links")
            .select("id, video_id, url, domain, description, category, created_at")
            .order("created_at", { ascending: false })
            .range(start, start + pageSize - 1);
          if (error) throw error;
          allLinks.push(...data);
          if (data.length < pageSize) break;
        }

        const categories = [...new Set(allLinks.map((link) => link.category).filter(Boolean))].sort();
        for (const value of categories) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          categorySelect.appendChild(option);
        }
        render();
      } catch (error) {
        console.error("Could not load links from Supabase:", error);
        countElement.textContent = "Could not load websites. Check the Supabase URL, public key, table permissions, and RLS policy.";
        resultsElement.replaceChildren();
      }
    }

    searchInput.addEventListener("input", render);
    categorySelect.addEventListener("change", render);
    loadLinks();
  </script>
</body>
</html>
