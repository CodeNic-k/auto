<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Category results</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./site-tools.js"></script>
  <style>
    :root { color-scheme:light; --ink:#20243a; --muted:#67708a; --line:#e3e7f0; --brand:#5548d9; --bg:#f6f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100% - 32px,920px); margin:auto; padding:32px 0 72px; }
    nav { display:flex; gap:10px; margin-bottom:28px; }
    nav a { padding:8px 13px; border-radius:10px; color:var(--muted); text-decoration:none; font-weight:650; }
    nav a:hover { background:#eae8ff; color:#4438bd; }
    .eyebrow { color:var(--brand); font-size:.8rem; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:8px 0; font-size:clamp(2rem,6vw,3rem); line-height:1.1; letter-spacing:-.04em; }
    .intro { color:var(--muted); }
    input { width:100%; min-height:48px; margin:18px 0 10px; padding:10px 13px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font:inherit; }
    input:focus { outline:3px solid #5548d933; border-color:var(--brand); }
    .count { color:var(--muted); font-size:.92rem; }
    #results { display:grid; gap:12px; }
    .card,.message { padding:19px; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 3px 14px #20243a08; }
    .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .title,.url { overflow-wrap:anywhere; font-size:1.08rem; font-weight:750; }
    .url { color:var(--brand); text-decoration:none; }
    .url:hover,.source:hover { text-decoration:underline; }
    .badge { flex:0 0 auto; padding:4px 9px; border-radius:99px; background:#f0efff; color:#4438bd; font-size:.76rem; font-weight:700; }
    .detail { margin:12px 0; color:#4e566e; white-space:pre-line; }
    .source { color:var(--muted); font-size:.9rem; text-decoration:none; }
    .message { border-style:dashed; color:var(--muted); text-align:center; }
    @media(max-width:620px) { .card-top { flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a href="./index.html">Websites</a><a href="./notes.html">Notes &amp; tips</a></nav>
    <header><div class="eyebrow" id="kind-label">Category</div><h1 id="heading">Loading…</h1><p class="intro" id="intro">Browse items in this category.</p></header>
    <input id="search" type="search" aria-label="Search category results" placeholder="Search in this category…">
    <p id="count" class="count" aria-live="polite">Loading…</p>
    <div id="results" aria-live="polite"></div>
  </main>
  <script>
    const params=new URLSearchParams(location.search),kind=params.get("type"),category=params.get("category");
    const isNotes=kind==="notes",table=isNotes?"notes":"links",heading=document.getElementById("heading"),label=document.getElementById("kind-label"),intro=document.getElementById("intro"),countEl=document.getElementById("count"),resultsEl=document.getElementById("results"),searchEl=document.getElementById("search");let rows=[],comments=new Map(),siteTools;
    label.textContent=isNotes?"Notes category":"Website category";
    heading.textContent=category||"Category not selected";
    intro.textContent=isNotes?"Main ideas and steps from videos in this category.":"Actionable links and instructions from videos in this category.";
    function text(parent,tag,value,className){const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;parent.appendChild(el);return el;}
    function linkLabel(item){try{const url=new URL(item.url),host=url.hostname.toLowerCase().replace(/^www\./,"");const query=url.searchParams.get("q");if(query&&/^google\.[a-z]{2,3}(?:\.[a-z]{2})?$/.test(host))return `Google search: ${query}`;}catch{}return item.domain||item.url;}
    function render(){const term=searchEl.value.trim().toLowerCase();const shown=rows.filter(x=>!term||[x.url,x.domain,x.description,x.title,x.detail,x.category].join(" ").toLowerCase().includes(term));resultsEl.replaceChildren();countEl.textContent=`${shown.length} ${isNotes?(shown.length===1?"note":"notes"):(shown.length===1?"website":"websites")}`;if(!shown.length){text(resultsEl,"div",rows.length?"No items match your search.":"There are no items in this category yet.","message");return;}for(const item of shown){const card=document.createElement("article");card.className="card";const top=document.createElement("div");top.className="card-top";if(isNotes){text(top,"div",item.title,"title");}else{const a=text(top,"a",linkLabel(item),"url");a.href=item.url;a.target="_blank";a.rel="noopener noreferrer";}text(top,"span",item.category||"Other","badge");card.appendChild(top);const detail=text(card,"p",isNotes?item.detail:(item.description||"No description provided."),"detail");const source=text(card,"a","Watch source video","source");source.href=`https://www.youtube.com/watch?v=${encodeURIComponent(item.video_id)}`;source.target="_blank";source.rel="noopener noreferrer";resultsEl.appendChild(card);siteTools.attach(card,item,isNotes?"note":"link",detail,comments.get(`${isNotes?"note":"link"}:${item.id}`)||[],load);}}
    async function load(){if(!category||!['notes','websites'].includes(kind)){countEl.textContent="This category link is incomplete.";text(resultsEl,"div","Open a category card from the Websites or Notes page.","message");return;}if(!window.supabase||!window.APP_SUPABASE_URL||!window.APP_SUPABASE_PUBLIC_KEY){countEl.textContent="Supabase configuration is missing.";return;}try{rows=[];comments=new Map();const db=window.supabase.createClient(window.APP_SUPABASE_URL,window.APP_SUPABASE_PUBLIC_KEY),columns=isNotes?"id,video_id,title,detail,category,created_at":"id,video_id,url,domain,description,category,created_at",size=1000;if(!siteTools){siteTools=window.createSiteTools(db);document.addEventListener("site-editor-change",render);}await siteTools.ready;for(let from=0;;from+=size){const{data,error}=await db.from(table).select(columns).eq("category",category).order("created_at",{ascending:false}).range(from,from+size-1);if(error)throw error;rows.push(...data);if(data.length<size)break;}comments=await siteTools.loadComments(rows,isNotes?"note":"link");render();}catch(error){console.error(error);countEl.textContent=`Could not load this ${isNotes?"notes":"website"} category.`;text(resultsEl,"div","Check Supabase table access, grants, and RLS policies.","message");}}
    searchEl.addEventListener("input",render);load();
  </script>
</body>
</html>
