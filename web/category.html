<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Category results</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./site-tools.js"></script>
  <style>
    :root { color-scheme:light; --ink:#20243a; --muted:#67708a; --line:#e3e7f0; --brand:#5548d9; --bg:#f6f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100% - 32px,920px); margin:auto; padding:32px 0 72px; }
    nav { display:flex; gap:10px; margin-bottom:28px; }
    nav a { padding:8px 13px; border-radius:10px; color:var(--muted); text-decoration:none; font-weight:650; }
    nav a:hover { background:#eae8ff; color:#4438bd; }
    .eyebrow { color:var(--brand); font-size:.8rem; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:8px 0; font-size:clamp(2rem,6vw,3rem); line-height:1.1; letter-spacing:-.04em; }
    .intro { color:var(--muted); }
    .controls { display:grid; grid-template-columns:minmax(0,1fr) minmax(145px,165px); gap:12px; margin:18px 0 10px; }
    input { width:100%; min-height:48px; margin:18px 0 10px; padding:10px 13px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font:inherit; }
    .controls input { margin:0; }
    select { min-height:48px; padding:10px 13px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font:inherit; }
    .page-size-control { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.9rem; }
    .page-size-control select { min-width:76px; }
    input:focus { outline:3px solid #5548d933; border-color:var(--brand); }
    .count { color:var(--muted); font-size:.92rem; }
    #results { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr)); align-items:stretch; gap:14px; }
    .card,.message { padding:19px; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 3px 14px #20243a08; }
    .card { display:flex; flex-direction:column; min-width:0; }
    .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .title,.url { overflow-wrap:anywhere; font-size:1.08rem; font-weight:750; }
    .url { color:var(--brand); text-decoration:none; }
    .url:hover,.source:hover { text-decoration:underline; }
    .badge { flex:0 0 auto; padding:4px 9px; border-radius:99px; background:#f0efff; color:#4438bd; font-size:.76rem; font-weight:700; }
    .detail { margin:12px 0; color:#4e566e; white-space:pre-line; }
    .source { color:var(--muted); font-size:.9rem; text-decoration:none; }
    .message { border-style:dashed; color:var(--muted); text-align:center; }
    .website-main { display:flex; flex-direction:column; min-width:0; }
    @media(max-width:620px) { #results { grid-template-columns:1fr; } .card-top { flex-direction:column; } .controls { grid-template-columns:1fr; } }
    .pagination { display:flex; align-items:center; justify-content:center; gap:12px; margin:22px 0 4px; }
    .pagination[hidden] { display:none; }
    .pagination button { min-height:40px; padding:8px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-weight:650; cursor:pointer; }
    .pagination button:hover:not(:disabled) { border-color:var(--brand); color:var(--brand); }
    .pagination button:disabled { opacity:.45; cursor:not-allowed; }
    .pagination span { color:var(--muted); font-size:.92rem; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a href="./index.html">Websites</a><a href="./notes.html">Notes &amp; tips</a></nav>
    <header><div class="eyebrow" id="kind-label">Category</div><h1 id="heading">Loading…</h1><p class="intro" id="intro">Browse items in this category.</p></header>
    <div class="controls">
      <input id="search" type="search" aria-label="Search category results" placeholder="Search in this category…">
      <label class="page-size-control" for="page-size">Per page
        <select id="page-size" aria-label="Category entries per page"><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option><option value="1000">1000</option></select>
      </label>
    </div>
    <p id="count" class="count" aria-live="polite">Loading…</p>
    <div id="results" aria-live="polite"></div>
    <div class="pagination" id="pagination" aria-label="Category pages" hidden></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const kind = params.get("type"), category = params.get("category"), isNotes = kind === "notes";
    const table = isNotes ? "notes" : "links";
    const heading = document.getElementById("heading"), label = document.getElementById("kind-label");
    const intro = document.getElementById("intro"), countEl = document.getElementById("count");
    const resultsEl = document.getElementById("results"), searchEl = document.getElementById("search");
    const paginationEl = document.getElementById("pagination"), pageSizeEl = document.getElementById("page-size");
    let rows = [], comments = new Map(), tagsByLink = new Map();
    let siteTools, page = 1, pageSize = 50;
    label.textContent = isNotes ? "Notes category" : "Website category";
    heading.textContent = category || "Category not selected";
    intro.textContent = isNotes ? "Main ideas and steps from videos in this category." : "Actionable links and instructions from videos in this category.";

    function text(parent, tag, value, className) {
      const el = document.createElement(tag);
      el.textContent = value;
      if (className) el.className = className;
      parent.appendChild(el);
      return el;
    }
    function linkLabel(item) {
      try {
        const url = new URL(item.url), host = url.hostname.toLowerCase().replace(/^www\./, "");
        const query = url.searchParams.get("q");
        if (query && /^google\.[a-z]{2,3}(?:\.[a-z]{2})?$/.test(host)) return `Google search: ${query}`;
      } catch {}
      return item.domain || item.url;
    }
    function renderPagination(total, noun, start, count) {
      const pageCount = Math.max(1, Math.ceil(total / pageSize));
      page = Math.min(page, pageCount);
      countEl.textContent = total ? `Showing ${start + 1}–${start + count} of ${total} ${noun}` : `0 ${noun}`;
      paginationEl.replaceChildren();
      paginationEl.hidden = pageCount <= 1;
      if (pageCount > 1) {
        const previous = text(paginationEl, "button", "Previous");
        previous.type = "button"; previous.disabled = page === 1;
        previous.addEventListener("click", () => { page--; render(); });
        text(paginationEl, "span", `Page ${page} of ${pageCount}`);
        const next = text(paginationEl, "button", "Next");
        next.type = "button"; next.disabled = page === pageCount;
        next.addEventListener("click", () => { page++; render(); });
      }
    }
    function render() {
      pageSize = Number(pageSizeEl.value) || 50;
      const term = searchEl.value.trim().toLowerCase();
      const matched = rows.filter(x => !term || [x.url, x.domain, x.description, x.title, x.detail, x.category, ...(tagsByLink.get(x.id) || []).filter(t => t.status === "approved").map(t => t.tag)].join(" ").toLowerCase().includes(term));
      const pageCount = Math.max(1, Math.ceil(matched.length / pageSize));
      page = Math.min(page, pageCount);
      const start = (page - 1) * pageSize, shown = matched.slice(start, start + pageSize);
      resultsEl.replaceChildren();
      renderPagination(matched.length, isNotes ? "notes" : "websites", start, shown.length);
      if (!matched.length) { text(resultsEl, "div", rows.length ? "No items match your search." : "There are no items in this category yet.", "message"); return; }
      for (const item of shown) {
        const card = document.createElement("article"); card.className = "card";
        const main = document.createElement("div"); main.className = isNotes ? "" : "website-main";
        const top = document.createElement("div"); top.className = "card-top";
        if (isNotes) text(top, "div", item.title, "title");
        else { const a = text(top, "a", linkLabel(item), "url"); a.href = item.url; a.target = "_blank"; a.rel = "noopener noreferrer"; }
        text(top, "span", item.category || "Other", "badge"); main.appendChild(top);
        const detail = text(main, "p", isNotes ? item.detail : (item.description || "No description provided."), "detail");
        if (!isNotes) siteTools.attachTags(main, item, tagsByLink.get(item.id) || [], load);
        const source = text(main, "a", "Watch source video", "source");
        source.href = `https://www.youtube.com/watch?v=${encodeURIComponent(item.video_id)}`; source.target = "_blank"; source.rel = "noopener noreferrer";
        siteTools.attach(main, item, isNotes ? "note" : "link", detail, comments.get(`${isNotes ? "note" : "link"}:${item.id}`) || [], load);
        if (isNotes) { card.appendChild(main); resultsEl.appendChild(card); }
        else { card.appendChild(main); resultsEl.appendChild(card); }
      }
    }
    async function load() {
      if (!category || !["notes", "websites"].includes(kind)) { countEl.textContent = "This category link is incomplete."; text(resultsEl, "div", "Open a category card from the Websites or Notes page.", "message"); return; }
      if (!window.supabase || !window.APP_SUPABASE_URL || !window.APP_SUPABASE_PUBLIC_KEY) { countEl.textContent = "Supabase configuration is missing."; return; }
      try {
        rows = []; comments = new Map(); tagsByLink = new Map();
        const db = window.supabase.createClient(window.APP_SUPABASE_URL, window.APP_SUPABASE_PUBLIC_KEY);
        const columns = isNotes ? "id,video_id,title,detail,category,created_at" : "id,video_id,url,domain,description,category,created_at";
        const size = 1000;
        if (!siteTools) { siteTools = window.createSiteTools(db); document.addEventListener("site-editor-change", render); }
        await siteTools.ready;
        for (let from = 0; ; from += size) {
          const { data, error } = await db.from(table).select(columns).eq("category", category).order("created_at", { ascending: false }).range(from, from + size - 1);
          if (error) throw error; rows.push(...data); if (data.length < size) break;
        }
        comments = await siteTools.loadComments(rows, isNotes ? "note" : "link");
        if (!isNotes) tagsByLink = await siteTools.loadTags(rows);
        render();
      } catch (error) {
        console.error(error); countEl.textContent = `Could not load this ${isNotes ? "notes" : "website"} category.`;
        text(resultsEl, "div", "Check Supabase table access, grants, and RLS policies.", "message");
      }
    }
    searchEl.addEventListener("input", () => { page = 1; render(); });
    pageSizeEl.addEventListener("change", () => { page = 1; render(); });
    load();
  </script>
</body>
</html>
