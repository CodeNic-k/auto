name: Process pending videos

on:
  # Keep checking the pending queue. If one run times out, a later scheduled run
  # starts from the rows that are still pending in Supabase.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "AI calls to make in this run"
        required: false
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: process-pending-videos
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Process pending videos
        run: python scripts/run.py
        env:
          RUN_MODE: process
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODELS: ${{ vars.OMNIROUTE_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS || secrets.GEMINI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
