name: Scan YouTube channels

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      discovery_limit:
        description: "Videos to scan per channel (0 means all; use 3 for the first trial)"
        required: false
        type: number
        default: 0
      batch_size:
        description: "Gemini video calls per run (new links+notes, then notes backfill; use 3 for a small run)"
        required: false
        type: number
        default: 20

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Run channel scanner
        run: python scripts/run.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCOVERY_LIMIT: ${{ github.event.inputs.discovery_limit || '0' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
