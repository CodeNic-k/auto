name: Daily YouTube discovery

on:
  # 00:00 in Asia/Kolkata (UTC is 5 hours 30 minutes behind).
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      discovery_limit:
        description: "Videos to scan per channel (0 means all uploads)"
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Discover channel videos
        run: python scripts/run.py
        env:
          RUN_MODE: discover
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCOVERY_LIMIT: ${{ github.event.inputs.discovery_limit || '0' }}
